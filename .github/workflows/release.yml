name: Release

# Push a tag like v0.1.0 to build the server for every platform and
# publish a GitHub release with the archives and SHA256SUMS.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - name: Build and package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            name="homebackupd-${VERSION}-${os}-${arch}"
            exe="homebackupd"; [ "$os" = windows ] && exe="homebackupd.exe"
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" -o "build/$name/$exe" ./cmd/homebackupd
            cp README.md LICENSE homebackup.example.json "build/$name/"
            case "$os" in
              darwin) cp deploy/macos/com.homebackup.homebackupd.plist "build/$name/" ;;
              linux)  cp deploy/linux/homebackupd.service "build/$name/" ;;
            esac
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/${TAG}.md"
          if [ -f "$notes" ]; then flags=(--notes-file "$notes"); else flags=(--generate-notes); fi
          gh release create "$TAG" dist/* --title "homebackup ${TAG#v}" "${flags[@]}"
