name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: HomeBackupKit tests
        working-directory: apple/HomeBackupKit
        run: swift test

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - darwin/arm64   # Mac mini (Apple silicon)
          - darwin/amd64   # Intel Mac
          - linux/arm64    # Raspberry Pi 4 (64-bit OS)
          - linux/amd64    # old PC
          - windows/amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: "0"
          TARGET: ${{ matrix.target }}
        run: |
          GOOS="${TARGET%/*}" GOARCH="${TARGET#*/}" make build
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: homebackupd-${{ strategy.job-index }}
          path: bin/
