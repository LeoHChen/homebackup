openapi: 3.1.0
info:
  title: homebackup API
  version: 0.1.0
  description: |
    HTTP API of homebackupd, used by the iPhone and Mac apps and the CLI.
    Devices pair with a 6-digit code from `homebackupd pair` and then send
    their token as `Authorization: Bearer <token>`. Off-loopback the server
    uses HTTPS with a self-signed certificate; clients pin the SHA-256 of its
    public key (certFingerprint, also advertised over Bonjour as `fp=`).
servers:
  - url: https://{host}:8420/api/v1
    variables:
      host:
        default: homebackup.local
security:
  - deviceToken: []
paths:
  /health:
    get:
      summary: Liveness check
      security: []
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  version: { type: string }
                  certFingerprint:
                    type: string
                    description: SHA-256 (hex) of the server's TLS public key; absent over plain HTTP.
  /pair:
    post:
      summary: Exchange a pairing code for a device token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, deviceName]
              properties:
                code: { type: string, example: "482913" }
                deviceName: { type: string, example: "Leo's iPhone" }
                platform: { type: string, enum: [ios, macos, cli] }
      responses:
        "200":
          description: Paired
          content:
            application/json:
              schema:
                type: object
                properties:
                  deviceId: { type: string }
                  token: { type: string }
                  certFingerprint: { type: string, description: Pin this key for all later requests. }
        "400": { description: Invalid deviceName or platform }
        "401": { description: Invalid or expired pairing code }
        "429": { description: Too many pairing attempts; see Retry-After }
  /status:
    get:
      summary: Server, disk, and source status
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /sources:
    get:
      summary: List configured sources
      responses:
        "200":
          description: Sources
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SourceStatus" }
  /sources/{id}/sync:
    post:
      summary: Start a sync now
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "202": { description: Sync queued }
        "404": { $ref: "#/components/responses/NotFound" }
  /files:
    get:
      summary: List a folder
      parameters:
        - { name: source, in: query, required: true, schema: { type: string } }
        - { name: path, in: query, schema: { type: string, default: "" } }
      responses:
        "200":
          description: Folder listing
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/File" }
  /files/{id}:
    get:
      summary: File metadata
      parameters:
        - { $ref: "#/components/parameters/FileId" }
      responses:
        "200":
          description: File
          content:
            application/json:
              schema: { $ref: "#/components/schemas/File" }
        "404": { $ref: "#/components/responses/NotFound" }
  /files/{id}/content:
    get:
      summary: Download file content (supports Range)
      parameters:
        - { $ref: "#/components/parameters/FileId" }
        - { name: version, in: query, schema: { type: string } }
      responses:
        "200": { description: Content, content: { application/octet-stream: {} } }
        "206": { description: Partial content }
        "404": { $ref: "#/components/responses/NotFound" }
  /files/{id}/versions:
    get:
      summary: Version history
      parameters:
        - { $ref: "#/components/parameters/FileId" }
      responses:
        "200":
          description: Versions, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Version" }
  /files/{id}/restore:
    post:
      summary: Restore a previous version or a trashed file
      parameters:
        - { $ref: "#/components/parameters/FileId" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                version: { type: string, description: Version ID to restore. Omit to restore from trash. }
                path: { type: string, description: "Trash restore only: restore to this path instead of the original." }
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/File" }
        "400": { description: Invalid path }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Target path occupied, or file is not in the trash }
  /trash:
    get:
      summary: List deleted files still within retention
      parameters:
        - { name: source, in: query, schema: { type: string } }
      responses:
        "200":
          description: Trashed files
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/File" }
  /uploads:
    post:
      summary: Start a resumable upload (used by the iPhone app)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, path, size, sha256]
              properties:
                source: { type: string, example: iphone }
                path: { type: string, example: "2026/11/IMG_0001.HEIC" }
                size: { type: integer, format: int64 }
                sha256: { type: string }
                assetId: { type: string, description: PhotoKit localIdentifier, used for dedupe }
                created: { type: string, format: date-time }
      responses:
        "201":
          description: Upload session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadId: { type: string }
                  offset: { type: integer, format: int64 }
        "200":
          description: |
            Either an existing session for the same item is resumed
            (uploadId and offset), or the item is already backed up
            with the same SHA-256 (status "exists", nothing to upload).
        "400": { description: Not a device-upload source, invalid path, size, or sha256 }
        "409": { description: Another device is uploading this item }
  /uploads/{id}:
    head:
      summary: Current offset of an upload (to resume)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Upload-Offset and Upload-Length headers
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Append a chunk
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: Upload-Offset, in: header, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/offset+octet-stream: {}
      responses:
        "204": { description: Chunk stored; new offset in Upload-Offset header }
        "400": { description: Chunk interrupted; bytes received are kept, resume from Upload-Offset }
        "409": { description: Offset mismatch; resume from the returned Upload-Offset }
        "413": { description: Chunk goes past the declared size }
  /uploads/{id}/complete:
    post:
      summary: Finish an upload and verify its SHA-256
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/File" }
        "409": { description: Not all bytes received yet; see Upload-Offset }
        "422": { description: Checksum mismatch; the upload is discarded }
  /devices:
    get:
      summary: List paired devices
      responses:
        "200":
          description: Devices
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                    platform: { type: string }
                    created: { type: string, format: date-time }
                    lastSeen: { type: string, format: date-time }
  /devices/{id}:
    delete:
      summary: Revoke a device token
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked }
components:
  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer
  parameters:
    FileId:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    Unauthorized:
      description: Missing or invalid device token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
    SourceStatus:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [gdrive, gphotos-takeout, device-upload, icloud-local] }
        schedule: { type: string, example: 1h0m0s }
        running: { type: boolean }
        lastSync: { type: string, format: date-time }
        lastError: { type: string }
    Status:
      type: object
      properties:
        version: { type: string }
        started: { type: string, format: date-time }
        root: { type: string }
        sources:
          type: array
          items: { $ref: "#/components/schemas/SourceStatus" }
    File:
      type: object
      properties:
        id: { type: string }
        source: { type: string }
        path: { type: string }
        name: { type: string }
        isDir: { type: boolean, description: "Directories have no id; list them with ?path=" }
        size: { type: integer, format: int64 }
        modified: { type: string, format: date-time }
        sha256: { type: string }
        deletedAt: { type: string, format: date-time }
    Version:
      type: object
      properties:
        id: { type: string }
        size: { type: integer, format: int64 }
        sha256: { type: string }
        created: { type: string, format: date-time }
