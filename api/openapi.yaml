openapi: 3.1.0
info:
  title: homebackup API
  version: 0.1.0
  description: |
    HTTP API of homebackupd, used by the iPhone and Mac apps and the CLI.
    Devices pair with a 6-digit code from `homebackupd pair` and then send
    their token as `Authorization: Bearer <token>`. Off-loopback the server
    uses HTTPS with a self-signed certificate; clients pin the SHA-256 of its
    public key (certFingerprint, also advertised over Bonjour as `fp=`).
servers:
  - url: https://{host}:8420/api/v1
    variables:
      host:
        default: homebackup.local
security:
  - deviceToken: []
paths:
  /health:
    get:
      summary: Liveness check
      security: []
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  version: { type: string }
                  certFingerprint:
                    type: string
                    description: SHA-256 (hex) of the server's TLS public key; absent over plain HTTP.
  /pair:
    post:
      summary: Exchange a pairing code for a device token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, deviceName]
              properties:
                code: { type: string, example: "482913" }
                deviceName: { type: string, example: "Leo's iPhone" }
                platform: { type: string, enum: [ios, macos, cli] }
      responses:
        "200":
          description: Paired
          content:
            application/json:
              schema:
                type: object
                properties:
                  deviceId: { type: string }
                  token: { type: string }
                  certFingerprint: { type: string, description: Pin this key for all later requests. }
        "400": { description: Invalid deviceName or platform }
        "401": { description: Invalid or expired pairing code }
        "429": { description: Too many pairing attempts; see Retry-After }
  /status:
    get:
      summary: Server, disk, and source status
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /sources:
    get:
      summary: List configured sources
      responses:
        "200":
          description: Sources
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SourceStatus" }
  /sources/{id}/sync:
    post:
      summary: Start a sync now
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "202": { description: Sync queued }
        "404": { $ref: "#/components/responses/NotFound" }
  /files:
    get:
      summary: List a folder
      parameters:
        - { name: source, in: query, required: true, schema: { type: string } }
        - { name: path, in: query, schema: { type: string, default: "" } }
      responses:
        "200":
          description: Folder listing
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/File" }
  /files/{id}:
    get:
      summary: File metadata
      parameters:
        - { $ref: "#/components/parameters/FileId" }
      responses:
        "200":
          description: File
          content:
            application/json:
              schema: { $ref: "#/components/schemas/File" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Rename or move a file or folder (drive sources only)
      description: A folder moves with everything in it. Missing parent folders are created.
      parameters:
        - { $ref: "#/components/parameters/FileId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string, example: "Archive/2026/report.pdf" }
      responses:
        "200":
          description: Moved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/File" }
        "400": { description: Invalid path, or a folder moved into itself }
        "403": { description: The source is read-only (it mirrors a cloud service) }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: An item with that path already exists }
    delete:
      summary: Move a file or folder to the trash (drive sources only)
      description: Deleting a folder trashes every file in it. Deleting a trashed item is a no-op.
      parameters:
        - { $ref: "#/components/parameters/FileId" }
      responses:
        "204": { description: Moved to the trash }
        "403": { description: The source is read-only }
        "404": { $ref: "#/components/responses/NotFound" }
  /folders:
    post:
      summary: Create a folder and any missing parents (drive sources only)
      description: Creating a folder that already exists returns it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, path]
              properties:
                source: { type: string, example: files }
                path: { type: string, example: "Work/Reports" }
      responses:
        "201":
          description: Folder
          content:
            application/json:
              schema: { $ref: "#/components/schemas/File" }
        "400": { description: Unknown source or invalid path }
        "403": { description: The source is read-only }
        "409": { description: A file exists where a folder is needed }
  /changes:
    get:
      summary: Change feed for sync clients
      description: |
        Start with cursor 0 to receive every item, then pass back the returned
        cursor to receive only what changed since. Keep calling while more is
        true. A trashed item appears with deletedAt; an item purged for good
        appears with removed=true. Works for every source; File Provider and
        the Photos app use it to stay in sync.
      parameters:
        - { name: source, in: query, required: true, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string, default: "0" }, description: '"latest" returns the current cursor without changes' }
        - { name: limit, in: query, schema: { type: integer, default: 1000, maximum: 1000 } }
      responses:
        "200":
          description: A page of changes, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  changes:
                    type: array
                    items:
                      type: object
                      properties:
                        seq: { type: integer, format: int64 }
                        removed: { type: boolean }
                        file: { $ref: "#/components/schemas/File" }
                  cursor: { type: string }
                  more: { type: boolean }
        "400": { description: Unknown source or invalid cursor }
  /files/{id}/content:
    get:
      summary: Download file content (supports Range)
      parameters:
        - { $ref: "#/components/parameters/FileId" }
        - { name: version, in: query, schema: { type: string } }
      responses:
        "200": { description: Content, content: { application/octet-stream: {} } }
        "206": { description: Partial content }
        "404": { $ref: "#/components/responses/NotFound" }
  /files/{id}/thumbnail:
    get:
      summary: JPEG thumbnail of a photo or video
      description: |
        Files with a media field have thumbnails. Thumbnails are cached by
        content, and small ones are made in the background after each sync.
        HEIC, RAW, and video need sips/qlmanage (macOS), heif-convert, or
        ffmpeg on the server. Use If-None-Match with the ETag to revalidate.
      parameters:
        - { $ref: "#/components/parameters/FileId" }
        - { name: size, in: query, schema: { type: string, enum: [small, large], default: small }, description: "small: 256 px, large: 1024 px on the longest side" }
      responses:
        "200": { description: Thumbnail, content: { image/jpeg: {} } }
        "304": { description: Not modified }
        "400": { description: Invalid size }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { description: No thumbnail for this file type (or the file cannot be decoded) }
  /files/{id}/versions:
    get:
      summary: Version history
      parameters:
        - { $ref: "#/components/parameters/FileId" }
      responses:
        "200":
          description: Versions, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Version" }
  /files/{id}/restore:
    post:
      summary: Restore a previous version or a trashed file
      parameters:
        - { $ref: "#/components/parameters/FileId" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                version: { type: string, description: Version ID to restore. Omit to restore from trash. }
                path: { type: string, description: "Trash restore only: restore to this path instead of the original." }
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/File" }
        "400": { description: Invalid path }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Target path occupied, or file is not in the trash }
  /trash:
    get:
      summary: List deleted files still within retention
      parameters:
        - { name: source, in: query, schema: { type: string } }
      responses:
        "200":
          description: Trashed files
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/File" }
  /uploads:
    post:
      summary: Start a resumable upload (iPhone app, and file saves to drive sources)
      description: |
        Device-upload sources dedupe by assetId. Drive sources create a new
        file at path, or with fileId add a new version of that file. If the
        file changed since baseSha256 (edited elsewhere) or was deleted, the
        upload is saved as "<name> (conflict from <device> <time>).<ext>"
        next to it, so no edit is lost.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, path, size, sha256]
              properties:
                source: { type: string, example: iphone }
                path: { type: string, example: "2026/11/IMG_0001.HEIC" }
                size: { type: integer, format: int64 }
                sha256: { type: string }
                assetId: { type: string, description: PhotoKit localIdentifier, used for dedupe }
                created: { type: string, format: date-time }
                fileId: { type: string, description: "Drive sources: replace this file (new version)" }
                baseSha256: { type: string, description: "Drive sources: content the client last saw, for conflict detection" }
      responses:
        "201":
          description: Upload session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadId: { type: string }
                  offset: { type: integer, format: int64 }
        "200":
          description: |
            Either an existing session for the same item is resumed
            (uploadId and offset), or the item is already backed up
            with the same SHA-256 (status "exists", nothing to upload).
        "400": { description: Not a device-upload or drive source, invalid path, size, or sha256 }
        "404": { description: "Drive sources: fileId not found" }
        "409": { description: "Another device is uploading this item, or (drive, no fileId) the path is taken" }
  /uploads/{id}:
    head:
      summary: Current offset of an upload (to resume)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Upload-Offset and Upload-Length headers
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Append a chunk
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: Upload-Offset, in: header, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/offset+octet-stream: {}
      responses:
        "204": { description: Chunk stored; new offset in Upload-Offset header }
        "400": { description: Chunk interrupted; bytes received are kept, resume from Upload-Offset }
        "409": { description: Offset mismatch; resume from the returned Upload-Offset }
        "413": { description: Chunk goes past the declared size }
  /uploads/{id}/complete:
    post:
      summary: Finish an upload and verify its SHA-256
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/File" }
        "409": { description: Not all bytes received yet; see Upload-Offset }
        "422": { description: Checksum mismatch; the upload is discarded }
  /devices:
    get:
      summary: List paired devices
      responses:
        "200":
          description: Devices
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                    platform: { type: string }
                    created: { type: string, format: date-time }
                    lastSeen: { type: string, format: date-time }
  /devices/{id}:
    delete:
      summary: Revoke a device token
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked }
components:
  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer
  parameters:
    FileId:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    Unauthorized:
      description: Missing or invalid device token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
    SourceStatus:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [gdrive, gphotos-takeout, device-upload, icloud-local] }
        schedule: { type: string, example: 1h0m0s }
        running: { type: boolean }
        lastSync: { type: string, format: date-time }
        lastError: { type: string }
    Status:
      type: object
      properties:
        version: { type: string }
        started: { type: string, format: date-time }
        root: { type: string }
        sources:
          type: array
          items: { $ref: "#/components/schemas/SourceStatus" }
    File:
      type: object
      properties:
        id: { type: string }
        source: { type: string }
        path: { type: string }
        name: { type: string }
        isDir: { type: boolean, description: "Folders created through the API have an id; folders implied by file paths do not. List them with ?path=" }
        size: { type: integer, format: int64 }
        modified: { type: string, format: date-time }
        sha256: { type: string }
        deletedAt: { type: string, format: date-time }
        media: { type: string, enum: [photo, video], description: "Set for files that have a thumbnail" }
        parentId: { type: string, description: "ID of the containing folder, if it has one (empty at the top level and under folders implied by file paths)" }
    Version:
      type: object
      properties:
        id: { type: string }
        size: { type: integer, format: int64 }
        sha256: { type: string }
        created: { type: string, format: date-time }
