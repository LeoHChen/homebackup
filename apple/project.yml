# Xcode project for the Apple apps. Generate it with `xcodegen` in this
# folder, then open HomeBackup.xcodeproj. Put your signing team in
# Local.xcconfig (not committed; see Local.xcconfig.example).
name: HomeBackup
options:
  bundleIdPrefix: com.github.leohchen
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    # App group shared by each app and its File Provider extension. iOS uses a
    # "group." identifier. macOS targets override it with a Team-ID-prefixed
    # one, which macOS 15+ accepts without a provisioning profile entry or a
    # "wants to access data from other apps" prompt, and which doubles as the
    # keychain access group for the device token.
    HB_APP_GROUP: group.com.github.leohchen.homebackup
packages:
  HomeBackupKit:
    path: HomeBackupKit
targets:
  HomeBackup:
    type: application
    platform: iOS
    sources: [HomeBackup]
    dependencies:
      - package: HomeBackupKit
      - target: HomeBackupFiles
    entitlements:
      path: HomeBackup/HomeBackup.entitlements
      properties:
        com.apple.security.application-groups: [$(HB_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.leohchen.homebackup
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: HomeBackup/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        GENERATE_INFOPLIST_FILE: NO
  HomeBackupFiles:
    # Files app integration (File Provider). The Mac app will reuse these sources.
    type: app-extension
    platform: iOS
    sources: [FileProvider]
    dependencies:
      - package: HomeBackupKit
    entitlements:
      path: FileProvider/FileProvider.entitlements
      properties:
        com.apple.security.application-groups: [$(HB_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.leohchen.homebackup.files
        INFOPLIST_FILE: FileProvider/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
  HomeBackupMac:
    # Menu bar app; shows each source in Finder through HomeBackupMacFiles.
    type: application
    platform: macOS
    sources: [HomeBackupMac]
    dependencies:
      - package: HomeBackupKit
      - target: HomeBackupMacFiles
    entitlements:
      path: HomeBackupMac/HomeBackupMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [$(HB_APP_GROUP)]
        keychain-access-groups: [$(HB_APP_GROUP)]
    settings:
      base:
        HB_APP_GROUP: $(DEVELOPMENT_TEAM).com.github.leohchen.homebackup
        PRODUCT_BUNDLE_IDENTIFIER: com.github.leohchen.homebackup.mac
        PRODUCT_NAME: HomeBackup
        INFOPLIST_FILE: HomeBackupMac/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
  HomeBackupMacFiles:
    # Finder integration (File Provider), same sources as the iOS extension.
    type: app-extension
    platform: macOS
    sources:
      - path: FileProvider
        excludes: ["*.plist", "*.entitlements"]
    dependencies:
      - package: HomeBackupKit
    entitlements:
      path: FileProvider/FileProviderMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [$(HB_APP_GROUP)]
        keychain-access-groups: [$(HB_APP_GROUP)]
    settings:
      base:
        HB_APP_GROUP: $(DEVELOPMENT_TEAM).com.github.leohchen.homebackup
        PRODUCT_BUNDLE_IDENTIFIER: com.github.leohchen.homebackup.mac.files
        INFOPLIST_FILE: FileProvider/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
