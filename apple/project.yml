# Xcode project for the Apple apps. Generate it with `xcodegen` in this
# folder, then open HomeBackup.xcodeproj. Put your signing team in
# Local.xcconfig (not committed; see Local.xcconfig.example).
name: HomeBackup
options:
  bundleIdPrefix: com.github.leohchen
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  HomeBackupKit:
    path: HomeBackupKit
targets:
  HomeBackup:
    type: application
    platform: iOS
    sources: [HomeBackup]
    dependencies:
      - package: HomeBackupKit
      - target: HomeBackupFiles
    entitlements:
      path: HomeBackup/HomeBackup.entitlements
      properties:
        com.apple.security.application-groups: [group.com.github.leohchen.homebackup]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.leohchen.homebackup
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: HomeBackup/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        GENERATE_INFOPLIST_FILE: NO
  HomeBackupFiles:
    # Files app integration (File Provider). The Mac app will reuse these sources.
    type: app-extension
    platform: iOS
    sources: [FileProvider]
    dependencies:
      - package: HomeBackupKit
    entitlements:
      path: FileProvider/FileProvider.entitlements
      properties:
        com.apple.security.application-groups: [group.com.github.leohchen.homebackup]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.leohchen.homebackup.files
        INFOPLIST_FILE: FileProvider/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
