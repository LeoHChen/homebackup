# Xcode project for the Apple apps. Generate it with `xcodegen` in this
# folder, then open HomeBackup.xcodeproj. Put your signing team in
# Local.xcconfig (not committed; see Local.xcconfig.example).
name: HomeBackup
options:
  bundleIdPrefix: com.github.leohchen
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  HomeBackupKit:
    path: HomeBackupKit
targets:
  HomeBackup:
    type: application
    platform: iOS
    sources: [HomeBackup]
    dependencies:
      - package: HomeBackupKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.leohchen.homebackup
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: HomeBackup/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        GENERATE_INFOPLIST_FILE: NO
